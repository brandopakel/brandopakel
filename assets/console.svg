<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="BP-CORE deep-space operations console: boot sequence nominal, awaiting instructions">
<style>
  text { font-family: "SFMono-Regular", "Cascadia Code", Consolas, Menlo, monospace; font-size: 15px; }
  .cy  { fill: #56d6e0; }
  .dim { fill: #6b7f8c; }
  .out { fill: #d7e7ee; }
  .amb { fill: #ffb454; }
  .mag { fill: #d982e6; }
  .ok  { fill: #57d99a; }
  .l1 { opacity:0; animation: pop .01s steps(1) .4s forwards; }
  .l2 { opacity:0; animation: pop .01s steps(1) 1.2s forwards; }
  .l3 { opacity:0; animation: pop .01s steps(1) 2.0s forwards; }
  .l4 { opacity:0; animation: pop .01s steps(1) 2.9s forwards; }
  .l5 { opacity:0; animation: pop .01s steps(1) 3.8s forwards; }
  .l6 { opacity:0; animation: pop .01s steps(1) 4.7s forwards; }
  @keyframes pop { to { opacity:1; } }
  .cursor { fill:#56d6e0; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .tw { animation: twinkle 3.4s ease-in-out infinite; }
  .t1 { animation-delay: .9s; } .t2 { animation-delay: 1.7s; } .t3 { animation-delay: 2.6s; }
  @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.95; } }
  .orbit { animation: orb 22s linear infinite; transform-origin: 806px 96px; }
  @keyframes orb { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .l1,.l2,.l3,.l4,.l5,.l6 { animation:none; opacity:1; }
    .cursor,.tw,.orbit { animation:none; }
  }
</style>
<defs>
  <radialGradient id="pg" cx="0.35" cy="0.3" r="1">
    <stop offset="0" stop-color="#3a4f66"/><stop offset="0.6" stop-color="#1a2736"/><stop offset="1" stop-color="#0b1119"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
