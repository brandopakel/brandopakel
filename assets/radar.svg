<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-label="Radar sweep — incoming transmissions">
<style>
  text { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  .sweep { animation: spin 5s linear infinite; transform-origin: 480px 75px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blip { animation: ping 5s ease-out infinite; }
  .b2 { animation-delay: 1.8s; } .b3 { animation-delay: 3.4s; }
  @keyframes ping { 0% { opacity:0; } 6% { opacity:1; } 45% { opacity:.25; } 100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .sweep { animation:none; } .blip { animation:none; opacity:.7; } }
</style>
<defs>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#57d99a" stop-opacity="0"/><stop offset="1" stop-color="#57d99a" stop-opacity="0.55"/>
  </linearGradient>
</defs>
<rect width="960" height="150" fill="#05080f"/>
<line x1="0" y1="75" x2="405" y2="75" stroke="#1b2733"/>
<line x1="555" y1="75" x2="960" y2="75" stroke="#1b2733"/>
<circle cx="480" cy="75" r="62" fill="none" stroke="#1e3040"/>
<circle cx="480" cy="75" r="42" fill="none" stroke="#1e3040"/>
<circle cx="480" cy="75" r="22" fill="none" stroke="#1e3040"/>
<line x1="418" y1="75" x2="542" y2="75" stroke="#16222d"/>
<line x1="480" y1="13" x2="480" y2="137" stroke="#16222d"/>
<g class="sweep"><path d="M480,75 L542,75 A62,62 0 0 0 523,31 Z" fill="url(#sw)"/><line x1="480" y1="75" x2="542" y2="75" stroke="#57d99a" stroke-width="1.6"/></g>
<circle class="blip" cx="502" cy="50" r="3" fill="#57d99a"/>
<circle class="blip b2" cx="452" cy="96" r="3" fill="#ffb454"/>
<circle class="blip b3" cx="512" cy="98" r="2.5" fill="#56d6e0"/>
<circle cx="480" cy="75" r="2.5" fill="#57d99a"/>
<text x="480" y="145" text-anchor="middle" fill="#6b7f8c" font-size="11" letter-spacing="4">INCOMING TRANSMISSIONS</text>
</svg>
